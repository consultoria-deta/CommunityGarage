[server]
; The community server. Leave these as they are.
host=forza.imnotmental.com
port=443
scheme=https
path_prefix=
insecure_tls=0

[account]
; Made automatically the first time the game starts; it identifies you to the server. Keep this file private.
key=
; The name shown as the creator of what you share. Empty = your gamertag from azimuth.ini.
name=

[updates]
; 1 = let the mod platform check GitHub (about every 6 hours) for a newer Community Garage and tell you on the title screen.
; 0 = never look. Nothing is downloaded or installed automatically.
check=1
